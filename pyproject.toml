[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sisgen-format-automation"
version = "0.1.0"
description = "Automatización de formatos SISGEN en DBF, Excel y reportes de auditoría."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Rommel Paredes Banda" }
]
dependencies = [
    "dbfread>=2.0.7",
    "dbf>=0.99.9",
    "openpyxl>=3.1.5",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "typer>=0.12.5",
    "rich>=13.7.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0"
]
desktop = [
    "PySide6>=6.7,<7.0",
]
packaging = [
    "pyinstaller>=6.0",
]

[project.scripts]
sisgen = "sisgen_automation.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true